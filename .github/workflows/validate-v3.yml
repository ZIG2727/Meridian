name: Validate Meridian V3
on:
  push:
    branches: [v3-curriculum]
  pull_request:
    branches: [v3-curriculum]
jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-v3.mjs
