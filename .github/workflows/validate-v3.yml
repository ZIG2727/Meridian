name: Validate Meridian V3
on:
  push:
    branches: [main, v3-curriculum]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: meridian-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript module syntax
        run: |
          for file in $(find js -type f -name '*.js'); do
            node --input-type=module --check < "$file"
          done
      - name: Validate curriculum data
        run: node scripts/validate-v3.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
      - name: Check browser test script syntax
        run: node --check scripts/visual-smoke.mjs
      - name: Run responsive browser smoke tests
        run: node scripts/visual-smoke.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-responsive-smoke
          path: artifacts/visual-smoke/
          if-no-files-found: ignore
          retention-days: 7
